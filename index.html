<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тюменская делегация — Алабуга</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #07090e;
      color: #c8d0d8;
    }

    .hero {
      text-align: center;
      padding: 80px 20px 50px;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 600px 300px at 50% 0%, rgba(74,122,156,0.08), transparent);
      pointer-events: none;
    }

    .hero .sticker {
      display: inline-block;
      background: linear-gradient(135deg, rgba(74,122,156,0.15), rgba(74,122,156,0.05));
      border: 1px solid rgba(74,122,156,0.25);
      border-radius: 100px;
      padding: 4px 18px;
      font-size: 10px;
      letter-spacing: 4px;
      color: #5a8aaa;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(32px, 8vw, 64px);
      font-weight: 300;
      line-height: 1.1;
      color: #e0e8f0;
    }
    .hero h1 .highlight {
      font-weight: 700;
      background: linear-gradient(135deg, #4a7a9c, #6a9aba);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      margin-top: 14px;
      font-size: 14px;
      color: #5a6a7a;
    }

    .hero .count-wrap {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 100px;
      padding: 6px 20px 6px 16px;
      font-size: 13px;
      color: #5a6a7a;
    }
    .hero .count-wrap .num {
      font-size: 22px;
      font-weight: 700;
      color: #4a7a9c;
      font-variant-numeric: tabular-nums;
    }

    .section-title {
      text-align: center;
      padding: 60px 20px 10px;
      font-size: 24px;
      font-weight: 300;
      color: #d0d8e0;
    }
    .section-title .sub {
      font-size: 12px;
      color: #4a6a7a;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 6px;
      font-weight: 400;
    }

    .team-grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 20px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    .card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.25s ease;
    }
    .card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(74,122,156,0.4);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 20px rgba(74,122,156,0.05);
      z-index: 2;
    }

    .card .pic {
      background: #0f1219;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card .pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .card:hover .pic img {
      transform: scale(1.05);
    }
    .card .pic .ph {
      padding: 40px;
      text-align: center;
      color: #3a4a5a;
      font-size: 14px;
    }

    .card .body {
      padding: 14px 16px 16px;
    }
    .card .body .name {
      font-size: 16px;
      font-weight: 600;
      color: #e0e8f0;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card .body .name .tag {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 100px;
      background: rgba(74,122,156,0.12);
      color: #5a8aaa;
    }
    .card .body .caption {
      font-size: 12.5px;
      color: #7a8a9a;
      line-height: 1.55;
    }

    .gallery {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 20px 80px;
      columns: 4 220px;
      column-gap: 12px;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.25s ease;
    }
    .gallery-item:hover {
      border-color: rgba(74,122,156,0.4);
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .gallery-item img {
      width: 100%;
      display: block;
    }
    .gallery-item .gi-ph {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      color: #3a4a5a;
      font-size: 13px;
      padding: 40px 20px;
      text-align: center;
    }

    .footer {
      text-align: center;
      padding: 30px 20px;
      font-size: 12px;
      color: #2a3a4a;
      border-top: 1px solid rgba(255,255,255,0.03);
    }
    .footer a {
      color: #3a5a6a;
      text-decoration: none;
    }
    .footer a:hover { color: #5a8aaa; }

    @media (max-width: 600px) {
      .team-grid { grid-template-columns: 1fr; }
      .gallery { columns: 2; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card { animation: fadeUp 0.4s ease backwards; }
    .card:nth-child(1) { animation-delay: 0.02s; }
    .card:nth-child(2) { animation-delay: 0.04s; }
    .card:nth-child(3) { animation-delay: 0.06s; }
    .card:nth-child(4) { animation-delay: 0.08s; }
    .card:nth-child(5) { animation-delay: 0.10s; }
    .card:nth-child(6) { animation-delay: 0.12s; }
    .card:nth-child(7) { animation-delay: 0.14s; }
    .card:nth-child(8) { animation-delay: 0.16s; }
    .card:nth-child(9) { animation-delay: 0.18s; }
    .card:nth-child(10) { animation-delay: 0.20s; }
    .card:nth-child(11) { animation-delay: 0.22s; }
    .card:nth-child(12) { animation-delay: 0.24s; }
  </style>
</head>
<body>

  <div class="hero">
    <div class="sticker">Тюменская делегация</div>
    <h1>Поездка в <span class="highlight">Алабугу</span></h1>
    <p>Фотоотчёт о том, как мы съездили и вернулись (не все)</p>
    <div class="count-wrap">
      <span class="num">11.5</span>
      <span>человек</span>
    </div>
  </div>

  <div class="section-title">
    Кто ездил
    <div class="sub">Состав делегации</div>
  </div>

  <div class="team-grid" id="grid"></div>

  <div class="section-title">
    Фото с поездки
    <div class="sub">Все моменты в одну ленту</div>
  </div>

  <div class="gallery" id="gallery"></div>

  <div class="footer">
    <a href="https://ilyasigma111.github.io/alabuga-forever/">ОЭЗ «Алабуга» — лучшая ОЭЗ в вашем регионе</a>
  </div>

  <script>
    const team = [
      { file: 'Алики.jpg', name: 'Алики', tag: 'Фанат Энергетика',
        caption: 'Поехала в Алабугу, потому что ей показалось, что там написано «Энергетик». Разочарована, но осталась.' },
      { file: 'Алина.jpg', name: 'Алина', tag: 'Глубокий человек',
        caption: 'Её поразила глубина вопросов на психологическом тестировании. Говорит, аж прониклась.' },
      { file: 'Артем.jpg', name: 'Артем', tag: 'Мемолог',
        caption: 'В телефоне дофига мемов. Пока все слушали экскурсию, Артем пополнял галерею.' },
      { file: 'Егор.jpg', name: 'Егор', tag: 'Просто крутой',
        caption: 'Просто крутой чувак.' },
      { file: 'Женя (это для тебя опенкод - она девочка, типо Евгения).jpg', name: 'Женя', tag: 'Тоже крутая',
        caption: 'Следует примеру Егора и тоже просто крутая.' },
      { file: 'Иван.jpg', name: 'Иван', tag: 'Музыкант',
        caption: 'Гитарист. Говорит, напишет альбом «ОЭЗ — это судьба».' },
      { file: 'Ильяйца.jpg', name: 'Ильяйца', tag: 'Просто Ильяйца',
        caption: 'Просто Ильяйца.' },
      { file: 'Какая то бабка (так и подпишешь фото).jpg', name: 'Попутчица', tag: '0.5 человека',
        caption: 'Какая-то бабка в поезде. Болтала с матрасом весь день. Матрас не отвечал, но слушал внимательно.' },
      { file: 'Марьяна.jpg', name: 'Марьяна', tag: 'Крутая в тренде',
        caption: 'Тоже просто крутая — тенденция намечается.' },
      { file: 'Матвеище.jpg', name: 'Матвеище', tag: 'Творец',
        caption: 'Автор удивительных произведений, способных поразить своим размахом. Или хотя бы удивить.' },
      { file: 'Настя (Дубровская).jpg', name: 'Настя Д.', tag: 'Лидер проекта',
        caption: 'Создала весь проект для защиты целиком и полностью. Остальные просто стояли рядом и хлопали.' },
      { file: 'Настя (Пиманова).jpg', name: 'Настя П.', tag: 'Укротительница котов',
        caption: 'Одна из немногих, кто прошла бизнес-котов сама. Остальные боялись. Настя — нет.' },
    ];

    const grid = document.getElementById('grid');
    team.forEach((p) => {
      const card = document.createElement('div');
      card.className = 'card';

      const pic = document.createElement('div');
      pic.className = 'pic';
      const img = document.createElement('img');
      img.src = p.file;
      img.alt = p.name;
      img.onerror = function () {
        this.remove();
        const ph = document.createElement('div');
        ph.className = 'ph';
        ph.textContent = '📷 ' + p.name;
        pic.appendChild(ph);
      };
      pic.appendChild(img);

      const body = document.createElement('div');
      body.className = 'body';
      body.innerHTML = '<div class="name">' + p.name + ' <span class="tag">' + p.tag + '</span></div><div class="caption">' + p.caption + '</div>';

      card.appendChild(pic);
      card.appendChild(body);
      grid.appendChild(card);
    });

    const galleryFiles = [
      'Галерея/2J_DxdziOhDSvFnSFC6csWAYvg1-rOBvDVZYlBIjrN8qpokbdb3wiAp4c8EdyQHOUqSNbESuGm3sUIJM8A0TLy6C.jpg',
      'Галерея/2nWYWMs01FWVvQt6mpfL0EC5QcYiyHsON4hJ8WO5No6ygY9e-88VWRNUwuizEYwiwpVhk5I2MECwhZLFNw2yzECd (1).jpg',
      'Галерея/dbK2_BObyO4WnAmNPYPW2-BkBbyqsVWWScsMD6FRwcoWec7kuYIWYF6r0iVinzT5pbPmLTuz3_EHe3j6rD1oqmiD.jpg',
      'Галерея/I-foRWieBAbgwBNmKlFgps_InPoWTJ9pbtTXHwDQjrMNvbedDo5NwXJixN347a58UfXbfqFEDo3x6Cxgv_alMrjT.jpg',
      'Галерея/MXR2AU4YjvNHkU50InQ-ohef90aEZ6i6nrA9uLr2mz2oyC54cKbITu_c5TOXxfPP9DkZ6Vg6K1437dTz0qx60hPY.jpg',
      'Галерея/nIHmRnNMEdodsB1TeFxqoj1ozXH83bKnj8HKPjcZ8fUPYDSKrg5lOWsBtXjBc3Ua5ToAWru7zMMl0hP-MetCEuCN.jpg',
      'Галерея/PJP7YSX8GrkQidQ7JGi9EYJ4w3alxgQQZsMISwRgIzxs6DRKFJAq42-wVP0uZG5rzeHhRzAQexK72WwdKg93PiYs.jpg',
      'Галерея/q5qOWqIoQNeb0OpwcQ44flzYlZlcSLqUhnwqdze6VfZQUeOEiy1uTBCeBWYLPgEZt9VFQw1Fcq5RVDoeOIx0IV_m.jpg',
      'Галерея/rBb6oJ8PiBWtoPt2oY-8_J_MFoifSsGL6WHAVo2GpzU-IezY60AuN6uF5cqc9X4FvS8D1x_bJlm44caW_v5FPBe1.jpg',
      'Галерея/tqiDBSrS3XAahBZsvec-mqjRKZfpV7sUnSf9TndGoeve_8BfIZ_yaSVyFyqciNkt_OTcO2VyBWmm4kud-v3UwNay.jpg',
      'Галерея/VmO1QV0Qpl-xMy3dohjvKBJDnJsaY6u-IfXqypuTPhPEJWosSw43mrXnYBZYO3EMp3XK796b_ghPHIUP-C2EOKHT.jpg',
      'Галерея/woDcNK__lnIEuKLpRzrZtEqN0mGcijlbwSeGE0baqvakTmFcSwsWhcrue4-qfg_U-GA0rfk3VsN2QeqNqrTQ1Wr-.jpg',
      'Галерея/Yq92JdRLd0L3tJ08awI7FiTvDZKq7GqHQJRjzAfxdZuGAv2qvFhXBWa38r3f3qjKlzDtxpln3QUbGCuWmRJsn-hY.jpg',
    ];

    const galleryEl = document.getElementById('gallery');
    galleryFiles.forEach((f) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';

      const img = document.createElement('img');
      img.src = f;
      img.alt = '';
      img.onerror = function () {
        this.remove();
        const ph = document.createElement('div');
        ph.className = 'gi-ph';
        ph.textContent = '📷 ' + f;
        item.appendChild(ph);
      };
      item.appendChild(img);
      galleryEl.appendChild(item);
    });

    if (galleryFiles.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #3a4a5a;';
      empty.textContent = 'Фото пока не загружены — кидай в папку и добавляй названия в массив galleryFiles';
      galleryEl.appendChild(empty);
    }
  </script>
</body>
</html>
