<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тюменская делегация — Алабуга</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e14;
      color: #c8d0d8;
    }
    .header {
      text-align: center;
      padding: 60px 20px 20px;
    }
    .header h1 {
      font-size: clamp(24px, 5vw, 42px);
      font-weight: 300;
      color: #e0e8f0;
      margin-bottom: 8px;
    }
    .header .sub {
      color: #5a8aaa;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .header .desc {
      color: #6a7a8a;
      font-size: 14px;
      margin-top: 12px;
    }
    .gallery {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .photo-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .photo-card:hover {
      border-color: rgba(74, 122, 156, 0.3);
    }
    .photo-card .img-wrap {
      background: #11151c;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .photo-card .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-card .caption {
      padding: 14px 16px;
      font-size: 13px;
      color: #a0b0c0;
      line-height: 1.5;
    }
    .photo-card .caption .name {
      color: #5a8aaa;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .footer {
      text-align: center;
      padding: 30px 20px;
      color: #3a4a5a;
      font-size: 12px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    @media (max-width: 640px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="sub">Тюменская делегация</div>
    <h1>Поездка в ОЭЗ «Алабуга»</h1>
    <p class="desc">Фотоотчёт о том, как мы съездили и вернулись (не все)</p>
  </div>

  <div class="gallery" id="gallery"></div>

  <div class="footer">
    Тюменская делегация © 2026 — вернулись, но стали частью Алабуги
  </div>

  <script>
    const photos = [

      // ===== МЕНЯЙ ПОДПИСИ ТУТ =====
      // Каждый объект: { file: 'ИмяФайла.jpg', caption: 'твоя шутка' }

      {
        file: 'Алики.jpg',
        caption: 'Алики — напиши тут шутку'
      },
      {
        file: 'Алина.jpg',
        caption: 'Алина — напиши тут шутку'
      },
      {
        file: 'Артем.jpg',
        caption: 'Артем — напиши тут шутку'
      },
      {
        file: 'Егор.jpg',
        caption: 'Егор — напиши тут шутку'
      },
      {
        file: 'Женя (это для тебя опенкод - она девочка, типо Евгения).jpg',
        caption: 'Женя — напиши тут шутку'
      },
      {
        file: 'Иван.jpg',
        caption: 'Иван — напиши тут шутку'
      },
      {
        file: 'Ильяйца.jpg',
        caption: 'Ильяйца — напиши тут шутку'
      },
      {
        file: 'Какая то бабка (так и подпишешь фото).jpg',
        caption: 'Бабка — напиши тут шутку'
      },
      {
        file: 'Марьяна.jpg',
        caption: 'Марьяна — напиши тут шутку'
      },
      {
        file: 'Матвеище.jpg',
        caption: 'Матвеище — напиши тут шутку'
      },
      {
        file: 'Настя (Дубровская).jpg',
        caption: 'Настя Д — напиши тут шутку'
      },
      {
        file: 'Настя (Пиманова).jpg',
        caption: 'Настя П — напиши тут шутку'
      },

    ];

    const gallery = document.getElementById('gallery');

    photos.forEach((p) => {
      const card = document.createElement('div');
      card.className = 'photo-card';

      const wrap = document.createElement('div');
      wrap.className = 'img-wrap';

      const img = document.createElement('img');
      img.src = p.file;
      img.alt = p.caption;
      img.onerror = function () {
        this.remove();
        const ph = document.createElement('div');
        ph.textContent = '📷 ' + p.file;
        ph.style.cssText = 'padding:40px;text-align:center;color:#3a4a5a;font-size:13px;';
        wrap.appendChild(ph);
      };
      wrap.appendChild(img);

      const cap = document.createElement('div');
      cap.className = 'caption';
      cap.innerHTML = p.caption;

      card.appendChild(wrap);
      card.appendChild(cap);
      gallery.appendChild(card);
    });
  </script>
</body>
</html>
