<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тюменская делегация — Алабуга</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e14;
      color: #c8d0d8;
    }

    .top {
      position: relative;
      text-align: center;
      padding: 60px 20px 40px;
      overflow: hidden;
    }
    .top::before {
      content: 'ТЮМЕНЬ — АЛАБУГА';
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(60px, 15vw, 140px);
      font-weight: 900;
      color: rgba(255,255,255,0.02);
      white-space: nowrap;
      pointer-events: none;
      letter-spacing: 10px;
    }
    .top .badge {
      display: inline-block;
      padding: 4px 14px;
      border: 1px solid rgba(74, 122, 156, 0.3);
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 3px;
      color: #5a8aaa;
      margin-bottom: 16px;
    }
    .top h1 {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 300;
      color: #e0e8f0;
      line-height: 1.2;
    }
    .top h1 span { font-weight: 700; color: #4a7a9c; }
    .top .sub {
      color: #6a7a8a;
      font-size: 14px;
      margin-top: 12px;
    }
    .top .count {
      margin-top: 20px;
      font-size: 13px;
      color: #4a6a7a;
    }
    .top .count strong { color: #6a9aba; font-size: 20px; }

    .team-grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 20px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(74, 122, 156, 0.4);
    }

    .card .pic {
      background: #11151c;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card .pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card .info {
      padding: 14px 16px 16px;
    }
    .card .info .name {
      font-size: 15px;
      font-weight: 600;
      color: #d0d8e0;
      margin-bottom: 6px;
    }
    .card .info .caption {
      font-size: 13px;
      color: #7a8a9a;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      padding: 30px 20px;
      color: #3a4a5a;
      font-size: 12px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    @media (max-width: 600px) {
      .team-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="top">
    <div class="badge">ТЮМЕНСКАЯ ДЕЛЕГАЦИЯ</div>
    <h1>Поездка в <span>ОЭЗ «Алабуга»</span></h1>
    <p class="sub">Фотоотчёт о том, как мы съездили и вернулись (не все)</p>
    <div class="count">Нас <strong>12</strong> — и мы всё ещё разговариваем друг с другом</div>
  </div>

  <div class="team-grid" id="grid"></div>

  <div class="footer">
    Тюменская делегация © 2026 — вернулись, но осадочек остался
  </div>

  <script>
    const photos = [
      {
        file: 'Алики.jpg',
        name: 'Алики',
        caption: 'Поехала в Алабугу, потому что ей показалось, что там написано «Энергетик». Разочарована, но осталась.'
      },
      {
        file: 'Алина.jpg',
        name: 'Алина',
        caption: 'Её поразила глубина вопросов на психологическом тестировании. Говорит, аж прониклась.'
      },
      {
        file: 'Артем.jpg',
        name: 'Артем',
        caption: 'В его телефоне дофига мемов. Пока все слушали экскурсию, Артем пополнял галерею.'
      },
      {
        file: 'Егор.jpg',
        name: 'Егор',
        caption: 'Просто крутой чувак.'
      },
      {
        file: 'Женя (это для тебя опенкод - она девочка, типо Евгения).jpg',
        name: 'Женя',
        caption: 'Следует примеру Егора и тоже просто крутая.'
      },
      {
        file: 'Иван.jpg',
        name: 'Иван',
        caption: 'Гитарист. Говорит, напишет альбом «ОЭЗ — это судьба».'
      },
      {
        file: 'Ильяйца.jpg',
        name: 'Ильяйца',
        caption: 'Просто Ильяйца.'
      },
      {
        file: 'Какая то бабка (так и подпишешь фото).jpg',
        name: 'Бабка',
        caption: 'Какая-то бабка в поезде. Болтала с матрасом весь день. Матрас не отвечал, но слушал внимательно.'
      },
      {
        file: 'Марьяна.jpg',
        name: 'Марьяна',
        caption: 'Тоже просто крутая — тенденция намечается.'
      },
      {
        file: 'Матвеище.jpg',
        name: 'Матвеище',
        caption: 'Автор удивительных произведений, способных поразить человека своим размахом. Или хотя бы удивить.'
      },
      {
        file: 'Настя (Дубровская).jpg',
        name: 'Настя Д.',
        caption: 'Создала весь проект для защиты целиком и полностью. Остальные просто стояли рядом и хлопали.'
      },
      {
        file: 'Настя (Пиманова).jpg',
        name: 'Настя П.',
        caption: 'Одна из немногих, кто прошла бизнес-котов сама. Остальные котов боялись. Настя — нет.'
      },
    ];

    const grid = document.getElementById('grid');

    photos.forEach((p) => {
      const card = document.createElement('div');
      card.className = 'card';

      const pic = document.createElement('div');
      pic.className = 'pic';

      const img = document.createElement('img');
      img.src = p.file;
      img.alt = p.name;
      img.onerror = function () {
        this.remove();
        const ph = document.createElement('div');
        ph.textContent = '📷 ' + p.name;
        ph.style.cssText = 'padding:40px;text-align:center;color:#3a4a5a;font-size:14px;';
        pic.appendChild(ph);
      };
      pic.appendChild(img);

      const info = document.createElement('div');
      info.className = 'info';
      info.innerHTML = '<div class="name">' + p.name + '</div><div class="caption">' + p.caption + '</div>';

      card.appendChild(pic);
      card.appendChild(info);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
